name: EE Internship Alerts

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

jobs:
  check-jobs:

    runs-on: ubuntu-latest

    env:

      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      BAY_AREA_DISCORD_WEBHOOK_URL: ${{ secrets.BAY_AREA_DISCORD_WEBHOOK_URL }}

      DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Discord secrets
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "❌ DISCORD_WEBHOOK_URL is EMPTY"
            exit 1
          fi

          if [ -z "$BAY_AREA_DISCORD_WEBHOOK_URL" ]; then
            echo "❌ BAY_AREA_DISCORD_WEBHOOK_URL is EMPTY"
            exit 1
          fi

          echo "✅ Both Discord webhook secrets are available"
    
      - name: Check internship listings
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BAY_AREA_DISCORD_WEBHOOK_URL: ${{ secrets.BAY_AREA_DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: python job_alert.py

      - name: Save seen jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_jobs.json

          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi

          git commit -m "Update seen internship jobs"
          git push
