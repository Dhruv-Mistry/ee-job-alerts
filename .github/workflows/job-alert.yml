name: EE Internship Alerts

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */2 * * *"
    - cron: "37 9 * * *"  # daily web search, 09:37 UTC

concurrency:
  group: ee-internship-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-jobs:

    runs-on: ubuntu-latest

    env:

      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      BAY_AREA_DISCORD_WEBHOOK_URL: ${{ secrets.BAY_AREA_DISCORD_WEBHOOK_URL }}

      LA_DISCORD_WEBHOOK_URL: ${{ secrets.LA_DISCORD_WEBHOOK_URL }}
      SOCAL_DISCORD_WEBHOOK_URL: ${{ secrets.SOCAL_DISCORD_WEBHOOK_URL }}
      DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}

      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      RUN_WEB_SEARCH: ${{ github.event_name == 'schedule' && github.event.schedule == '37 9 * * *' }}
      SEARCHES_PER_DAY: "3"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Discord secrets
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "❌ DISCORD_WEBHOOK_URL is EMPTY"
            exit 1
          fi

          if [ -z "$BAY_AREA_DISCORD_WEBHOOK_URL" ]; then
            echo "❌ BAY_AREA_DISCORD_WEBHOOK_URL is EMPTY"
            exit 1
          fi

          if [ -z "$LA_DISCORD_WEBHOOK_URL" ] || [ -z "$SOCAL_DISCORD_WEBHOOK_URL" ]; then
            echo "❌ LA_DISCORD_WEBHOOK_URL or SOCAL_DISCORD_WEBHOOK_URL is EMPTY"
            exit 1
          fi
          echo "✅ All four Discord webhook secrets are available"
    
      - name: Check internship listings
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BAY_AREA_DISCORD_WEBHOOK_URL: ${{ secrets.BAY_AREA_DISCORD_WEBHOOK_URL }}
          LA_DISCORD_WEBHOOK_URL: ${{ secrets.LA_DISCORD_WEBHOOK_URL }}
      SOCAL_DISCORD_WEBHOOK_URL: ${{ secrets.SOCAL_DISCORD_WEBHOOK_URL }}
      DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          SEARCHES_PER_DAY: "3"
        run: python job_alert.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internship-diagnostics
          path: job_diagnostics.csv
          if-no-files-found: ignore
          retention-days: 14

      - name: Save seen jobs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_jobs.json

          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi

          git commit -m "Update seen internship jobs"
          git push
